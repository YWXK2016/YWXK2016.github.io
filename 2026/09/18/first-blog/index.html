作系统：windows10(cpu 16G + gpu 6G)</span></span><br><span class="line"><span class="comment"> *		- VS版本：VS2017</span></span><br><span class="line"><span class="comment"> *		- python版本：3.8.5（将.pth文件转成.pt文件）</span></span><br><span class="line"><span class="comment"> *		- torch版本：1.7.1 + cu102</span></span><br><span class="line"><span class="comment"> *		- torchaudio版本：0.7.2</span></span><br><span class="line"><span class="comment"> *		- torchvision版本：0.8.2 + cu102</span></span><br><span class="line"><span class="comment"> *		- cuda版本：10.2.89</span></span><br><span class="line"><span class="comment"> *		- cudnn版本：7.6.2.24</span></span><br><span class="line"><span class="comment"> *		- libtorch版本：1.7.1 + cu102</span></span><br><span class="line"><span class="comment"> *		- opencv版本：4.5.1</span></span><br><span class="line"><span class="comment"> * 【模型说明】</span></span><br><span class="line"><span class="comment"> *		- superpoint_v2.pt: 用torch.jit.script()转换得到的模型，将数据输入该模型进行前向传播直接得到特征点、得分以及描述子</span></span><br><span class="line"><span class="comment"> *		- superglue_indoor.pt：用torch.jit.script()转换得到的模型，对应python中的superglue_indoor.pth模型。</span></span><br><span class="line"><span class="comment"> *		- superglue_outdoor.pt：用torch.jit.script()转换得到的模型，对应python中的superglue_outdoor.pth模型。</span></span><br><span class="line"><span class="comment"> * 【较V2版本的改进】</span></span><br><span class="line"><span class="comment"> *		- 函数封装</span></span><br><span class="line"><span class="comment"> *		- 可选择模型运行的设备(my_device)：CPU(at::kCPU)/GPU(at::kCUDA)</span></span><br><span class="line"><span class="comment"> *		- 可选择是否显示结果(show_result)：true/false</span></span><br><span class="line"><span class="comment"> *		- 将输入由两张图像改为一个包含多张图像的文件夹，文件夹下的图像两两进行匹配</span></span><br><span class="line"><span class="comment"> *		- 将superpoint检测得到的特征点坐标及描述子输出到特征点文件（.key文件）</span></span><br><span class="line"><span class="comment"> *		- 将superglue的匹配结果输出到匹配文件（matches.txt文件）</span></span><br><span class="line"><span class="comment"> **********************************************************************************************************/</span></span><br><span class="line"></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;iostream&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;torch/torch.h&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;torch/script.h&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;memory&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;opencv2/opencv.hpp&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;opencv2/core.hpp&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;opencv2/imgcodecs.hpp&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;opencv2/highgui.hpp&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&quot;Processing.h&quot;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;time.h&gt;</span></span></span><br><span class="line"></span><br><span class="line"><span class="keyword">using</span> <span class="keyword">namespace</span> std;</span><br><span class="line"><span class="keyword">using</span> <span class="keyword">namespace</span> cv;</span><br><span class="line"><span class="keyword">using</span> <span class="keyword">namespace</span> torch;</span><br><span class="line"><span class="keyword">using</span> <span class="keyword">namespace</span> torch::indexing;</span><br><span class="line"></span><br><span class="line"><span class="comment">//可修改参数</span></span><br><span class="line"><span class="comment">/************************************************************************************************************/</span></span><br><span class="line"><span class="type">const</span> <span class="type">char</span>* superpoint_module_path = <span class="string">&quot;../exp_data/superpoint_v2.pt&quot;</span>;				<span class="comment">//superpoint模型文件</span></span><br><span class="line"><span class="type">const</span> <span class="type">char</span>* superglue_indoor_module_path = <span class="string">&quot;../exp_data/superglue_indoor.pt&quot;</span>;		<span class="comment">//superglue_indoor模型文件</span></span><br><span class="line"><span class="type">const</span> <span class="type">char</span>* superglue_outdoor_module_path = <span class="string">&quot;../exp_data/superglue_outdoor.pt&quot;</span>;		<span class="comment">//superglue_outfoor模型文件</span></span><br><span class="line"><span class="type">const</span> <span class="type">bool</span> indoor_model = <span class="literal">true</span>;			<span class="comment">//true则加载superglue_indoor模型文件，false则加载superglue_outdoor模型文件</span></span><br><span class="line"><span class="type">const</span> Size re_size = <span class="built_in">Size</span>(<span class="number">640</span>, <span class="number">480</span>);	<span class="comment">//输入网络的图像尺寸（对原图像缩放后的尺寸）</span></span><br><span class="line"><span class="type">const</span> <span class="type">int</span> max_keypoints = <span class="number">1200</span>;			<span class="comment">//特征点的最大数量，-1默认全部保留</span></span><br><span class="line"><span class="keyword">auto</span> my_device = at::kCUDA;				<span class="comment">//at::kCUDA：在GPU上运行模型；at::kCPU：在CPU上运行模型</span></span><br><span class="line"><span class="type">const</span> <span class="type">bool</span> show_result = <spa ript::Module superpoint_module;</span><br><span class="line">	superpoint_load_start = <span class="built_in">clock</span>();	<span class="comment">//开始计时</span></span><br><span class="line">	<span class="keyword">try</span> &#123;</span><br><span class="line">		<span class="comment">//反序列化：导入TorchScript模型</span></span><br><span class="line">		superpoint_module = torch::jit::<span class="built_in">load</span>(superpoint_module_path);</span><br><span class="line">	&#125;</span><br><span class="line">	<span class="keyword">catch</span> (<span class="type">const</span> c10::Error&amp; e) &#123;</span><br><span class="line">		cerr &lt;&lt; <span class="string">&quot;[Error] error loading the module: &quot;</span> &lt;&lt; superpoint_module_path &lt;&lt; endl;</span><br><span class="line">		<span class="keyword">return</span> EXIT_FAILURE;</span><br><span class="line">	&#125;</span><br><span class="line">	superpoint_load_finish = <span class="built_in">clock</span>();	<span class="comment">//结束计时</span></span><br><span class="line">	superpoint_module.<span class="built_in">to</span>(my_device);	<span class="comment">//将模型放在指定设备上</span></span><br><span class="line">	cout &lt;&lt; <span class="string">&quot;[Info] Successfully loaded the module: &quot;</span> &lt;&lt; superpoint_module_path &lt;&lt; endl;</span><br><span class="line">	cout &lt;&lt; <span class="string">&quot;[Time_info] Time spent loading superpoint module: &quot;</span> &lt;&lt; (<span class="type">double</span>)(superpoint_load_finish - superpoint_load_start) / CLOCKS_PER_SEC &lt;&lt; <span class="string">&quot;s&quot;</span> &lt;&lt; endl;</span><br><span class="line"></span><br><span class="line">	<span class="comment">//4.加载superglue模型</span></span><br><span class="line">	<span class="type">const</span> <span class="type">char</span>* superglue_module_path = <span class="literal">NULL</span>;</span><br><span class="line">	<span class="keyword">if</span> (indoor_model)</span><br><span class="line">	&#12
